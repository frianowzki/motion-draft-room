<script>
// the footer is pinned, so the page has to know how tall it is: a two-row bar on a
// phone is taller than one on a desk, and the body reserves exactly that much.
function measureFooter(){
  const f = document.querySelector("footer"); if (!f) return;
  document.documentElement.style.setProperty("--fbar-h", Math.round(f.offsetHeight) + "px");
}
measureFooter();
addEventListener("resize", measureFooter, {passive:true});
addEventListener("orientationchange", () => setTimeout(measureFooter, 120));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureFooter);

const CAP = 32, SIZE = 5;
// Rarity drives the Score Boost in the real formula. Motion publishes the formula
// and the tier order, not the multipliers - so the UI shows the boost it is using
// and says the values are an assumption.
const RARITY = ["Common", "Rare", "Epic", "Legendary"];
let BOOST = { Common: 1, Rare: 1.1, Epic: 1.25, Legendary: 1.5 };
const STAR = "★";
let PROF = null;
let DATA = null, FILTER = "all", SEL = null, PICKS = [];
let PAGE = 1;
// One colour per signal, used by the filter rail and the draft card alike, so a
// creator's colour means the same thing wherever it appears on the page.
const TAGC = { SURGING: "var(--up)", COILED: "var(--warm)", SLEEPER: "var(--cool)",
  FADE: "var(--down)", QUIET: "var(--faint)" };
// Fifteen on a desk, and not one row fewer when the draft panel opens beside
// the board. The page used to be measured to the board's height, so picking a
// creator grew the panel, the board grew with it, and the same board showed ten
// rows before the pick and fourteen after — the pager said 1/8 and then 1/6 for
// the same list. A fixed page keeps the board's height its own business.
const PER_PAGE = 15;
// A phone shows five: a page you scroll is not a page, and five rows plus the
// pager still leaves the draft panel and the timeline within a thumb's reach.
const PER_PAGE_PHONE = 5;
// The breakpoint these two rules are written against, read live. .matches is
// checked at call time on purpose: a page that loads before mobile emulation is
// applied captured "desktop" once and paged ten rows for the whole session.
const PHONE_MQ = window.matchMedia("(max-width:640px)");
const isPhone = () => PHONE_MQ.matches;
// The one place that answers "how many rows is a page": render, the pager and the
// fit check all read it, so a 5-row page can never claim 10 of 79 underneath.
const perPageNow = () => (isPhone() ? PER_PAGE_PHONE : PER_PAGE);
// Declared here, above render(): render() closes any open card, and a `let` that
// appears later in the file is still in its temporal dead zone on the first paint
// — the whole dashboard then failed with "Cannot access 'cardEl' before init".
let cardEl = null, cardTimer = null, cardFor = null, cardBack = null, sheetOpener = null;

// ---------- utils
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const fmt = (v, d = 1) => v == null ? "—" : (typeof v === "number" ? v.toFixed(d) : v);
const signed = v => v == null ? "—" : (v > 0 ? "+" + v : String(v));
const cls = v => v == null ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// every icon is a <symbol> in the sprite at the top of the document
// Official avatar: Motion's own leaderboard serves /pfp/<id>.jpg. 8 of the 79 ids have
// no image there yet (404), so a failed load is swapped for initials in place (classes
// re-derived from data-extra (the size), since inline onerror can only use double quotes here).
// When the creator's X account is confirmed, its profile photo wins: it is the face
// people actually recognise, and Motion's crop is a tiny leaderboard thumbnail that is
// sometimes still a placeholder. Same short-circuit as the hover card.
const AV_FB = "this.className='avatar av-fb'+(this.dataset.extra?''+this.dataset.extra:'');this.textContent=(this.dataset.ini||'?');this.onerror=null";
const avatar = (c, size) => {
  const cls = "avatar" + (size ? " " + size : "");
  const ini = esc((((c && c.name) || "?").trim().slice(0, 2)).toUpperCase());
  const prof = (c && DATA.profiles && DATA.profiles[c.name]) || null;
  const src = (prof && prof.avatar) || (c && c.id ? `https://leaderboard.motion.game/pfp/${encodeURIComponent(c.id)}.jpg` : "");
  if (src) {
    return `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-ini="${ini}" data-extra="${esc(size || "")}" onerror="${AV_FB}">`;
  }
  return `<span class="${cls} av-fb">${ini}</span>`;
};
const icon = (name, extra) => `<svg class="ic"${extra ? ` style="${extra}"` : ""}><use href="#i-${name}"/></svg>`;

// Identity is the X account that authorised through /api/xauth, not a handle typed
// into a box: a receipt under a name its owner never claimed is not a receipt.
// The server reads the signed session cookie, so nothing here is trusted for filing.
const HANDLE_RE = /^@?[A-Za-z0-9_]{1,15}$/;
let ME = null, AUTH_CFG = null;  // {connected, configured, user}
const strip = v => String(v || "").replace(/^@/, "");
function handle() {
  const v = ME && ME.user ? strip(ME.user.handle) : "";
  return HANDLE_RE.test(v) ? v : "";
}
async function loadSession() {
  try {
    const r = await fetch("/api/xauth/status", { headers: { accept: "application/json" }, cache: "no-store", credentials: "same-origin" });
    ME = await r.json();
  } catch (e) {
    ME = { connected: false, configured: null, reason: "the status endpoint is unreachable" };
  }
  AUTH_CFG = ME && ME.configured;
  [renderWho(), renderLineup()].forEach(f => { try { f(); } catch (e) {} });
}
// popup round trip: X's screen opens in its own window, the callback posts back
function connectX() {
  const w = 520, h = 640;
  const left = Math.max(0, (screen.width - w) / 2), top = Math.max(0, (screen.height - h) / 2.6);
  const win = window.open("/api/xauth/start", "mdr_xauth",
    `width=${w},height=${h},left=${Math.round(left)},top=${Math.round(top)},menubar=no,toolbar=no`);
  if (!win) { $("#whoBody").insertAdjacentHTML("beforeend", '<div class="hint" style="color:var(--warm)">The sign-in window was blocked. Allow popups for this site and try again.</div>'); return; }
  loadSession();
}
window.addEventListener("message", e => {
  if (e.data && e.data.type === "mdr-oauth") { loadSession(); loadBook(); }
});
async function disconnectX() {
  await fetch("/api/xauth/logout", { credentials: "same-origin", cache: "no-store" }).catch(() => {});
  ME = { connected: false, configured: AUTH_CFG };
  renderWho(); renderLineup();
}

// ---------- load
async function load() {
  // /api/signals is the live copy (refetched from the data branch). /signals.json is the
  // snapshot bundled at build time — it keeps the page working if the API is unreachable.
  // X profiles are resolved separately: a build-time copy plus /api/profiles, and
  // the board still renders without them (the card just says it cannot confirm one)
  try {
    for (const u of ["/api/profiles", "/profiles.json"]) {
      try {
        const pr = await fetch(u, { headers: { accept: "application/json" } });
        if (!pr.ok) continue;
        const pj = await pr.json();
        PROF = pj.profiles || pj;
        if (PROF && Object.keys(PROF).length) break;
      } catch (e) {}
    }
  } catch (e) {}
  const urls = ["/api/signals", "/signals.json"];
  let lastErr = null;
  for (const u of urls) {
    try {
      const r = await fetch(u, { headers: { accept: "application/json" }, cache: "no-store" });
      if (!r.ok) throw new Error(u + " " + r.status);
      DATA = await r.json();
      break;
    } catch (e) { lastErr = e; }
  }
  if (!DATA) {
    $("#rows").innerHTML = `<tr><td colspan="7" class="empty">Could not load signals (${esc(lastErr && lastErr.message)}). The collector runs every 4 hours.</td></tr>`;
    return;
  }
  // history is a separate read: the board must paint even if it fails, so it is
  // fetched after DATA and the Timeline simply says so when there is nothing yet
  await refreshHistory();
  if (DATA.rarity && DATA.rarity.assumedBoost) BOOST = DATA.rarity.assumedBoost;
  PICKS = JSON.parse(localStorage.getItem("mdr_picks") || "[]").map(p => ({ ...p, rarity: p.rarity || "Common" }));
  if (PROF) DATA.profiles = PROF;
  render();
  BOOTED = true;
  SIG_FP = JSON.stringify(DATA);
  HIST_LAST = TL.events ? TL.events.length - 1 : 0;
  bindBar();
  loadBook();          // redraws both the public book and the receipts card

  // the identity card used to be drawn only from load()'s render path, so whichever of
  // the two finished last could leave it empty; draw it with the session it is waiting on
  renderWho();
}

// The bar goes solid only once there is something under it. A scroll listener on
// a passive event, read from the layout rather than a magic offset, so it works
// whatever the board's height turns out to be.
// ---------- board history: read live, not once
// The collector writes a new window every four hours, so a page left open on a
// desk would keep showing the windows it booted with. This pulls /api/history on
// the same beat the board does, and redraws only when the newest slot or the
// window count actually changed - a refetch that re-renders every minute would
// yank the rail back to the newest card while someone is reading an old one.
let HIST_FP = null;
async function refreshHistory() {
  try {
    const hr = await fetch("/api/history", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!hr.ok) return false;
    const hj = await hr.json();
    // /api/history names the field "windows"; keep the page's own shape so the
    // Timeline reads the same object whether it came from the API or a bundle
    const wins = (hj.windows || []).map(w => ({
      slot: w.slot || w.asOf || w.collectedAt,
      asOf: w.asOf,
      collectedAt: w.collectedAt,
      rows: w.rows || [],
    }));
    const fp = wins.length + "|" + (wins.length ? (wins[wins.length - 1].slot || "") : "");
    const changed = fp !== HIST_FP;
    HIST_FP = fp;
    DATA.history = wins;
    return changed;
  } catch (e) {
    return false;
  }
}

function bindBar() {
  const bar = document.querySelector(".appbar");
  if (!bar) return;
  let queued = false;
  const read = () => { queued = false; bar.classList.toggle("stuck", window.scrollY > 8); };
  window.addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(read);
  }, { passive: true });
  read();
}

// ---------- public receipt book
let BOOK = null, BOOK_ERR = null;
// BOOK_TRIES drives a short retry: a cold lambda or a dropped packet should not
// leave the card saying the book is gone for the rest of the visit. Three attempts,
// then it waits for the minute beat, which retries anything that failed.
let BOOK_TRIES = 0, BOOK_BUSY = false, LAST_BOOK = null;
async function loadBook() {
  if (BOOK_BUSY) return;           // the poll and the post-lock refresh can collide
  BOOK_BUSY = true;
  try {
    let last = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await fetch("/api/receipts", { headers: { accept: "application/json" }, cache: "no-store" });
        if (!r.ok) throw new Error(r.status === 404 ? "offline" : r.status === 401 ? "sign-in expired" : "HTTP " + r.status);
        BOOK = await r.json();
        LAST_BOOK = BOOK;
        BOOK_ERR = null; BOOK_TRIES = 0;
        last = null;
        break;
      } catch (e) {
        last = e; BOOK_TRIES++;
        if (attempt < 2) await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
      }
    }
    // A failed attempt must not blind the card for the rest of the visit: the last
    // good book stays on screen with a stale note, and the minute beat keeps trying.
    if (last) {
      BOOK_ERR = last.message || "no response";
      BOOK = LAST_BOOK;
    }
  } finally {
    BOOK_BUSY = false;
  }
  renderBook();
  renderMine();     // the receipts card reads the same object and used to lag a beat behind
}

// Split a figure into prefix, digits and suffix so a count-up can animate the
// digits alone: "62%" keeps its sign, "$12M" keeps its unit, "a / b" counts both.
// Anything without a number (an em dash, a word) is left exactly as it is.
function tallyParts(v) {
  const t = String(v == null ? "" : v).trim();
  const m = /^([^0-9]*?)(\d[\d,]*(?:\.\d+)?)(.*)$/.exec(t);
  if (!m) return `<span>${esc(t)}</span>`;
  const [, pre, digits, suf] = m;
  const dec = (digits.split(".")[1] || "").length;
  const unit = /\s|[A-Za-z]{2,}/.test(suf);
  // ratios such as "41 / 38" carry a second figure: count both, once
  // a ratio's second figure gets its own counting span; the pieces are escaped
  // before they are joined, never after, or the span would be escaped with them
  const ratio = /^(\s*\/\s*)(\d[\d,]*(?:\.\d+)?)([\s\S]*)$/.exec(suf);
  // the slash is its own element so flex spacing rules it, not a stray character
  const tail = ratio
    ? `<span class="sl">/</span><span class="live" data-to="${ratio[2].replace(/,/g, "")}" data-dec="0">${esc(ratio[2])}</span>${sufTail(ratio[3], unit)}`
    : sufTail(suf, unit);
  return `${esc(pre)}<span class="live" data-to="${digits.replace(/,/g, "")}" data-dec="${dec}">${esc(digits)}</span>${tail}`;
}

// the leftover text after a figure: long or spaced suffixes (" months", " in 5")
// are set smaller than the number, short ones ("M", "%", "k") keep full size
function sufTail(suf, unit) {
  if (!suf) return "";
  return unit ? `<span class="unit">${esc(suf)}</span>` : esc(suf);
}

// Count the figures up once, when the row comes into view, and never again: the
// numbers are a read of the board, not decoration, so re-running it on every
// render (which happens on each page change) would be a twitch, not a reveal.
function countUp() {
  const box = $("\#stats");
  if (!box || box.dataset.counted === "1") return;
  const lives = [...box.querySelectorAll(".live")];
  if (!lives.length) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || typeof window.requestAnimationFrame !== "function") return;
  const run = () => {
    if (box.dataset.counted === "1") return;
    box.dataset.counted = "1";
    const DUR = 1200, STAGGER = 80;
    // biggest figure first, the rest follow, like a proof counter
    const order = lives.map((_, i) => i)
      .sort((a, b) => Math.abs(+lives[b].dataset.to) - Math.abs(+lives[a].dataset.to) || a - b);
    const delay = [];
    order.forEach((idx, rank) => { delay[idx] = rank * STAGGER; });
    const finals = lives.map(el => +el.dataset.to || 0);
    const decs = lives.map(el => +el.dataset.dec || 0);
    let t0 = -1;
    const tick = now => {
      if (t0 < 0) t0 = now;
      let done = true;
      lives.forEach((el, i) => {
        const p = Math.min(1, Math.max(0, (now - t0 - delay[i]) / DUR));
        if (p < 1) done = false;
        const eased = 1 - Math.pow(1 - p, 3);
        const f = Math.pow(10, decs[i]);
        const val = p >= 1 ? finals[i] : Math.round(finals[i] * eased * f) / f;
        el.textContent = val.toLocaleString("en-US", { minimumFractionDigits: decs[i], maximumFractionDigits: decs[i] });
      });
      if (!done) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  if (typeof IntersectionObserver === "undefined") { run(); return; }
  const io = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) { io.disconnect(); run(); }
  }, { threshold: 0.5 });
  io.observe(box);
}

// How many rows a page holds. A counted page, not a measured one: the board
// stretches to the draft panel beside it, and measuring its leftovers made the
// page size a consequence of whether a pick was open.
function rowsPerPage() {
  return perPageNow();
}

function render() {
  const d = DATA;
  // a re-render replaces every row, so any open card belongs to an element that
  // no longer exists — paging or filtering with it up left a stale card pinned
  // to the screen showing the previous page's creator
  hideCard();

  // ---- stats
  // the board reads rank-first: the raw feed arrives in arbitrary order, so sort
  // once here and every filter, page and count inherits the order. Rank 0 means
  // "unranked" upstream, so those sink to the bottom instead of leading.
  const cr = [...d.creators].sort((a, b) =>
    (a.position || 1e9) - (b.position || 1e9) || a.name.localeCompare(b.name));
  const gainers = cr.filter(c => c.delta4h > 0).length;
  const losers = cr.filter(c => c.delta4h < 0).length;
  // distinct 4-hour windows: several runs inside one window add no history
  const slotWindows = [...new Set((d.slotTimes || []))].length;
  const avgAbs = cr.length ? (cr.reduce((a, c) => a + Math.abs(c.delta4h), 0) / cr.length) : 0;
  const stats = [
    ["users", "Creators", cr.length, "on the board"],
    ["activity", "Up / down", `${gainers} / ${losers}`, "last 4h"],
    ["gauge", "Avg Δ4h", fmt(avgAbs, 2), "rank places"],
    ["clock", "Slots tracked", slotWindows, slotWindows === 1 ? "distinct window" : "distinct windows"],
    ["star", "Star cap", CAP, "per tournament"],
  ];
  // A tally row: figure over a hairline, label under it. Each figure splits into
  // prefix / number / suffix so the number can count while the units stay put.
  // The same markup is a marquee on a phone: one .track (two copies of the group)
  // instead of a grid, so the figures cost one line of height, not three.
  const statHtml = stats.map(([ico, k, v, sub]) =>
    `<div class="tally"><div class="num">${tallyParts(v)}</div>
      <span class="lab">${icon(ico)}${esc(k)}${sub ? ` <span class="sub" style="opacity:.55">&middot; ${esc(sub)}</span>` : ""}</span></div>`).join('<span class="sep" aria-hidden="true"></span>');
  $("#stats").innerHTML = `<div class="track"><div class="stat-grp">${statHtml}</div>`
    + `<div class="stat-grp" aria-hidden="true">${statHtml}</div></div>`;
  countUp();

  // ---- honest limits banner
  if (slotWindows < 3) {
    if (!document.querySelector(".warn")) {
      const b = el("div", "warn");
      b.innerHTML = `${icon("info")}<span>${slotWindows <= 1
        ? `Only ${slotWindows || d.snapshotCount} distinct 4-hour window so far. Δ over multiple slots and acceleration need 3+ windows (~12h); until then those cells stay "—". Nothing is backfilled or invented.`
        : `Only ${slotWindows} distinct 4-hour windows so far. Acceleration needs 3+ (~12h); until then it stays "—". Nothing is backfilled or invented.`}</span>`;
      const anchor = $("#stats");
      anchor.parentNode.insertBefore(b, anchor.nextSibling);
    }
  }

  // A horizontal rail that does not fit gets a fade on the edge that hides content.
// Reading scrollLeft on every scroll event keeps the left fade honest once the
// user has moved: the fade is a signal, not decoration.
function paintRail(rail) {
  if (!rail) return;
  const tick = () => {
    const max = rail.scrollWidth - rail.clientWidth;
    const cut = max > 2, atEnd = rail.scrollLeft <= 2, pre = cut && !atEnd;
    rail.classList.toggle("atrail", cut);
    rail.classList.toggle("atboth", pre);
    rail.dataset.cut = cut ? "1" : "0";
  };
  tick();
  if (!rail.dataset.railbound) {
    rail.dataset.railbound = "1";
    rail.addEventListener("scroll", () => requestAnimationFrame(tick), { passive: true });
    window.addEventListener("resize", () => requestAnimationFrame(tick), { passive: true });
  }
}

// ---- filters: the rail doubles as a read of the board, so each option carries
  // its colour dot (the same one the SIGNAL column uses) and its own count.
  const tags = ["all", "SURGING", "COILED", "SLEEPER", "FADE", "QUIET"];
  const tagged = cr.filter(c => (c.tags || []).length).length;
  $("#filters").innerHTML = "";
  tags.forEach(t => {
    const n = t === "all" ? cr.length : cr.filter(c => c.tags.includes(t)).length;
    const b = el("button", "tab" + (FILTER === t ? " on" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", FILTER === t ? "true" : "false");
    // the colour travels as a custom property so the ring, the tint and the dot
    // are all the same hue without three hard-coded values per option
    b.style.setProperty("--hue", t === "all" ? "var(--faint)" : TAGC[t]);
    if (n === 0) b.classList.add("zero");
    b.innerHTML = `<span class="tl">${t === "all" ? "All" : `${`<i></i>`}${t}`}</span><b>${n}</b>`;
    // a creator can carry several signals, so these counts overlap and do not
    // add up to the board size - the title says it rather than implying a partition
    b.title = t === "all"
      ? `${cr.length} creators on the board`
      : `${n} of ${tagged} tagged creators carry ${t}. A creator can carry more than one signal, so the filter counts overlap.`;
    b.onclick = () => { FILTER = t; PAGE = 1; render(); };
    $("#filters").appendChild(b);
  });

  // the rail can be wider than a phone, so it tells the eye when it is cut off
  paintRail($("#filters"));

  // ---- table
  const list = FILTER === "all" ? cr : cr.filter(c => c.tags.includes(FILTER));

  // The page holds as many rows as the card can show without scrolling. The board
  // sits beside the draft panel and stretches to match it, so a fixed ten rows
  // left a hole when that panel grew (an open pick is ~190px taller). Rows are
  // measured, not guessed: ask for the space, divide by the row height. The ten
  // is a floor so an unmeasured first paint is still a sane page, the 25 a cap.
  const perPage = rowsPerPage();
  const pages = Math.max(1, Math.ceil(list.length / perPage));
  if (PAGE > pages) PAGE = pages;
  const start = (PAGE - 1) * perPage;
  const slice = list.slice(start, start + perPage);

  const tb = $("#rows");
  // build the page in a detached tbody and swap it in once. Setting tb.innerHTML=""
  // on the live element emptied the table before the loop had written anything,
  // so a re-render that threw halfway left a blank board; building off-document
  // means the old rows survive until the new ones are complete.
  const batch = document.createDocumentFragment();
  slice.forEach(c => {
    const picked = PICKS.some(p => p.name === c.name);
    const tr = el("tr", "row" + (SEL === c.name ? " sel" : "") + (picked ? " picked" : ""));
    tr.innerHTML = `
      <td class="pos">${c.position}</td>
      <td class="name"><span class="ncell">${avatar(c)}<span class="nwrap">${esc(c.name)}${picked ? ' <span class="tag COILED">IN</span>' : ""}</span></span></td>
      <td class="mono ${cls(c.delta4h)}">${signed(c.delta4h)}</td>
      <td title="momentum ${fmt(c.momentum)} out of ${fmt(100, 0)} — rank-weighted move">${bullet(c.momentum)}</td>
      <td class="mono stars" title="estimated stars (1-8)">${c.estStars}<span>/${8}</span></td>
      <td>${badges(c.tags)}</td>
      <td class="add" title="${picked ? "In your lineup" : "Draft this creator"}">${picked ? icon("check") : icon("plus")}</td>`;
    // On a phone the row is the target: a 26px face is not something a thumb can
    // be asked to hit, and tapping a creator should open that creator, not just
    // mark the row. On a desk the row still only selects — the card there is a
    // hover surface and the draft panel beside the board does the picking.
    tr.onclick = () => { SEL = c.name; render(); if (isPhone()) openCard(tr, c); };
    batch.appendChild(tr);
    // pointing at a name opens the profile card; the card itself stays usable so
    // its links and the pick button can be clicked. Bind after the row is in the
    // document, otherwise the .ncell lookup finds nothing.
    // only the avatar opens the card: hovering the name is how you read the row,
    // and a card covering the table every time the pointer crossed a name made
    // the board hard to read. The row itself still selects the creator.
    const av = tr.querySelector(".ncell .avatar");
    if (av) bindCard(av, c);
  });

  // The last page holds 9 of 10 rows. Without filling the gap the table shrinks
  // and the pager jumps up, so the remainder is padded with spacer rows that keep
  // every row the identical height. They are hidden from screen readers.
  for (let i = slice.length; i < perPage; i++) {
    const ph = el("tr", "row pad");
    ph.setAttribute("aria-hidden", "true");
    // a table row with no cells has zero height, so the spacer carries one empty
    // cell per column to hold the same vertical rhythm as a real row
    ph.innerHTML = "<td></td>".repeat(7);
    batch.appendChild(ph);
  }

  tb.innerHTML = "";
  tb.appendChild(batch);
  renderPager(pages, list.length, start, slice.length);


  renderDetail();
  renderLineup();
  syncClear();
  // the timeline is a read of history, so it renders with the panels and not
  // with the rows: paging the board must not rebuild it or reset its position
  renderTimeline();


  // The marquee's speed comes from its own width, so the strip drifts at the same
  // pace whatever the figures say (a fixed duration would sprint on a wide set).
  // 6px a second reads as movement without being a ticker racing a headline.
  // A reduced-motion reader is handled in CSS: the animation is dropped and the
  // strip becomes something they can scroll by hand.
  if (isPhone()) {
    // scrollWidth is 0 inside this frame — the markup was just written. Measure on
    // the next one, once the strip has a length to divide.
    requestAnimationFrame(() => {
      const tr = $("#stats .track");
      const half = tr ? tr.scrollWidth / 2 : 0;
      if (half > 0) tr.style.setProperty("--mdr", `${Math.round(half / 6)}s`);
    });
  }
  // while the strip is touched it holds still, so a finger can read the figure it
  // landed on. The flag is on the band; CSS takes the animation off it.
  const band = $("#stats");
  if (band && !band._press) {
    band._press = true;
    const hold = v => () => { band.toggleAttribute("data-paused", v); };
    band.addEventListener("pointerdown", hold(true));
    band.addEventListener("pointerup", hold(false));
    band.addEventListener("pointercancel", hold(false));
    band.addEventListener("pointerleave", hold(false));
  }
}

// ---- momentum as a bullet chart: a track, a fill the size of the move, and a
// target tick at the average so a bar reads against something, not in a void.
const AVG_MOM = (() => {
  const vals = ((DATA && DATA.creators) || []).map(c => Math.abs(c.momentum || 0)).filter(v => v > 0);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
})();

function bullet(m) {
  if (m == null || !isFinite(m)) return '<span class="bc"></span>';
  const share = Math.max(0, Math.min(100, Math.abs(m)));
  const tgt = AVG_MOM ? Math.max(2, Math.min(98, Math.abs(AVG_MOM))) : null;
  // the bar wears the same colour as the number beside it, so up reads green and
  // down reads red without having to compare two colour systems
  const tone = m > 0 ? " up" : m < 0 ? " down" : "";
  return `<span class="bc${tone}" aria-hidden="true"><span class="track"></span>`
    + `<span class="fill" style="width:${share.toFixed(1)}%"></span>`
    + (tgt != null ? `<span class="target" style="left:${tgt.toFixed(1)}%"></span>` : "")
    + `</span>`;
}

// ---- status badge: a dot plus the word, tinted by state
const BADGE_WORD = { SURGING: "surging", COILED: "coiled", SLEEPER: "sleeper",
  FADE: "fading", QUIET: "quiet", STEADY: "steady" };
function badges(tags) {
  const seen = new Set();
  return (tags || []).filter(t => BADGE_WORD[t])
    .filter(t => { if (seen.has(t)) return false; seen.add(t); return true; })
    .map(t => `<span class="sb ${t}"><i></i>${BADGE_WORD[t]}</span>`).join(" ");
}

// ---- pager: numbered, with neighbours around the current page
/* ---- timeline ---------------------------------------------------------------
   Ported from beui.dev's draggable timeline, minus React and Tailwind. The same
   four behaviours are kept because they are what makes it feel like a timeline
   and not a carousel: a press only becomes a drag past a few pixels, a flick
   coasts on for as many events as its velocity earns, the track rubber-bands at
   the ends instead of hard-stopping, and the settle is a spring, not a tween.
   Cards are laid out once by transform, so a 40-slot history still drags smoothly
   on a phone. */
const TL = {
  i: 0,              // focused event index
  x: 0,              // current track offset, px
  dragging: false,
  vel: 0,
  lastT: 0,
  raf: 0,
  events: [],
  w: 240,            // card width from CSS (--w)
  settle: 0,         // spring state
};

const TL_SPRING = { stiffness: 120, damping: 24, mass: 1 };
const TL_DRAG_THRESHOLD = 4;   // px before a press is a drag, not a click
const TL_FLICK = 0.3;          // events per (px/s) of release velocity
const TL_FLICK_MAX = 4;        // cap, so a hard flick cannot jump the whole history
const TL_RUBBER = 0.3;         // past either end the track follows at this fraction
const TL_SIDE_SCALE = 0.72;

function tlEvents() {
  // One event per recorded window. A snapshot carries the whole board at that
  // moment, so the interesting part is the movement since the previous one: the
  // movers are the story, the absolute ranks are already in the table above.
  const hist = (DATA && DATA.history) || [];
  const out = [];
  for (let i = 0; i < hist.length; i++) {
    const h = hist[i];
    const prev = hist[i - 1];
    const rank = new Map((h.rows || []).map(r => [r.name, r.position]));
    const before = prev ? new Map((prev.rows || []).map(r => [r.name, r.position])) : null;
    const movers = [];
    if (before) {
      rank.forEach((pos, name) => {
        const was = before.get(name);
        if (was == null) { movers.push({ name, d: null, isNew: true }); return; }
        const d = was - pos;            // a smaller position number is a better rank
        if (d) movers.push({ name, d });
      });
      movers.sort((a, b) => Math.abs(b.d || 0) - Math.abs(a.d || 0));
    }
    const slot = h.slot || h.collectedAt || "";
    out.push({
      id: slot || String(i),
      when: slot ? new Date(slot.length > 10 ? slot : slot + ":00:00Z") : null,
      slot,
      rows: (h.rows || []).length,
      movers: movers.slice(0, 3),
      moved: movers.length,
      isFirst: !before,
    });
  }
  return out;
}

function tlBuild() {
  const stage = $("#tlStage"), track = $("#tlTrack"), root = $("#tline");
  if (!stage || !track || !root) return;
  if (DATA && DATA.history && !root.dataset.built) {
    // keep the last known history if a later load brings a shorter one
  }
  TL.events = tlEvents();
  const evs = TL.events;

  const cnt = $("#tlCount");
  if (cnt) cnt.textContent = evs.length ? `${evs.length} window${evs.length === 1 ? "" : "s"}` : "no windows yet";

  if (!evs.length) {
    track.innerHTML = `<div class="tlev" style="--w:auto"><div class="tlcard">
      <div class="tlwhen">No history yet</div>
      <div class="tlnames"><div><span class="none">The first window lands after the next collection.</span></div></div>
    </div></div>`;
    stage.style.cursor = "default";
    return;
  }

  track.innerHTML = evs.map((e, i) => {
    const when = e.when
      ? e.when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "UTC" })
      : e.slot;
    const mov = e.isFirst
      ? `<div><span class="none">First snapshot — nothing to compare.</span></div>`
      : e.movers.length
        ? e.movers.map(m => m.isNew
            ? `<div><em class="up">new</em><span>${esc(m.name)}</span></div>`
            : `<div><em class="${m.d > 0 ? "up" : "down"}">${m.d > 0 ? "+" : ""}${m.d}</em><span>${esc(m.name)}</span></div>`
          ).join("")
        : `<div><span class="none">Nobody moved.</span></div>`;
    const big = e.isFirst
      ? `<span>creators</span><b style="margin-left:auto">${e.rows}</b>`
      : `<b>${e.moved}</b><span>moved</span>`;
    return `<div class="tlev" role="tab" aria-selected="${i === 0}" data-i="${i}">
      <div class="tlcard">
        <div class="tlwhen"><span>${esc(when)}</span><span class="tag">${e.isFirst ? "baseline" : "4h"}</span></div>
        <div class="tlbig">${big}</div>
        <div class="tlnames">${mov}</div>
      </div>
      <div class="tlticks"><i></i><i></i><i></i><i></i><i></i></div>
    </div>`;
  }).join("");

  // Measure one slot's laid-out width. offsetWidth, not getBoundingClientRect:
  // the rect includes the scale transform this code applies, so on a board whose
  // cards were already scaled it read 206 for a 240px slot and every downstream
  // centre, target and threshold drifted with it. Cleared first so a rebuild
  // measures the layout and not the last frame's scale.
  const first = track.querySelector(".tlev");
  if (first) first.style.transform = "";
  const cs = first ? getComputedStyle(first) : null;
  TL.w = first ? first.offsetWidth : Number((cs && cs.width) || 240) || 240;

  TL.i = Math.min(TL.i, evs.length - 1);
  tlPad();
  tlBind();
  tlLayout(true);
}

function tlPad() {
  const stage = $("#tlStage"), track = $("#tlTrack");
  if (!stage || !track || !track.children.length) return;
  // Half a stage minus half a card puts the first card's centre exactly on the
  // stage's centre with the track untranslated. Padding of a plain half stage
  // left it short by half a card, so card 0 opened off-centre and permanently
  // scaled at d = 0.5.
  const cardW = track.children[0].offsetWidth || TL.w || 240;
  const pad = Math.max(0, Math.round((stage.clientWidth - cardW) / 2));
  track.style.setProperty("--tpad", `${pad}px`);
}

// where the track must sit to centre card i, with no clamping: cards are packed
// from the left, so the first card cannot be centred by scrolling — the track is
// padded instead and the origin of this offset is the padding
function tlTargetRaw(i) {
  // measured against the track's own box, so the half-stage padding on each side
  // is included. offsetLeft alone ignores it and the first card would overshoot.
  const track = $("#tlTrack"), stage = $("#tlStage");
  const el = track && track.children[i];
  if (!el || !stage) return 0;
  const tr = track.getBoundingClientRect();
  // measure the card, not its slot: .tlev carries padding for the gap between
  // cards, so the slot's centre is not the card's centre and every target would
  // land off by half that padding
  const face = el.querySelector(".tlcard") || el;
  const er = face.getBoundingClientRect();
  // the track's live transform moves the rects together, so this is the card's
  // position inside the track, independent of where the track currently sits
  const centreInTrack = (er.left - tr.left) + er.width / 2;
  return centreInTrack - stage.clientWidth / 2;
}

// How far the track must be pulled left so card i sits in the centre. The track
// is padded by half a stage, so card 0 already starts centred: its offset is the
// zero point, and every target is measured relative to it. Clamped to the travel
// the history actually has, so the ends never show air.
function tlTarget(i) {
  const base = tlTargetRaw(0);
  const lastIdx = Math.max(0, (TL.events.length || 1) - 1);
  const min = 0, max = Math.max(0, tlTargetRaw(lastIdx) - base);
  const want = tlTargetRaw(i) - base;
  if (max <= 0) return 0;
  return Math.max(min, Math.min(max, want));
}

function tlLayout(animate) {
  const track = $("#tlTrack"), stage = $("#tlStage");
  if (!track || !stage) return;
  if (!animate) TL.x = tlTarget(TL.i);
  track.style.transition = "";
  track.style.transform = `translate3d(${-TL.x}px,0,0)`;

  // Scale and veil by distance from the stage centre. The distance must be read
  // from geometry this loop does not touch: measuring the slots' rects would read
  // back the scale applied on the previous frame, so a focused card never reached
  // d = 0 and sat permanently small and off-centre. Slot centres are laid out by
  // the flex track at fixed positions, so they are derived arithmetically here
  // (track padding + i * card pitch) and the scale is applied after.
  const half = stage.clientWidth / 2;
  const kids = track.children;
  const pitch = TL.w || 240;
  const padL = parseFloat(getComputedStyle(track).paddingLeft) || 0;
  for (let i = 0; i < kids.length; i++) {
    const k = kids[i];
    const centre = padL + i * pitch + pitch / 2 - TL.x;
    const d = Math.min(1, Math.abs(centre - half) / pitch);
    const scale = 1 - (1 - TL_SIDE_SCALE) * d;
    k.style.transform = `scale(${scale.toFixed(3)})`;
    k.style.opacity = String(1 - 0.55 * d);
    k.setAttribute("aria-selected", String(i === TL.i));
  }
  // progress rail under the stage
  const rail = document.querySelector(".tlrailrow i"), lbl = document.querySelector(".tlrailrow b");
  if (rail) rail.style.width = `${TL.events.length > 1 ? (TL.i / (TL.events.length - 1)) * 100 : 100}%`;
  if (lbl) lbl.textContent = `${TL.i + 1} / ${TL.events.length}`;
}

function tlSpringTo(idx) {
  const from = TL.x, to = tlTarget(idx);
  const stage = $("#tlStage");
  if (!stage) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || Math.abs(to - from) < 0.5) { TL.x = to; tlLayout(); return; }

  cancelAnimationFrame(TL.settle);
  let v = 0, x = from;
  const { stiffness, damping, mass } = TL_SPRING;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.064, (now - last) / 1000);
    last = now;
    // a spring, integrated semi-implicitly: it keeps the flick's momentum as its
    // initial velocity, so a hard throw overshoots slightly and comes back
    const a = (-stiffness * (x - to) - damping * v) / mass;
    v += a * dt;
    x += v * dt;
    TL.x = x;
    tlLayout();
    if (Math.abs(x - to) < 0.4 && Math.abs(v) < 8) {
      TL.x = to; tlLayout(); TL.settle = 0; return;
    }
    TL.settle = requestAnimationFrame(step);
  };
  TL.settle = requestAnimationFrame(step);
}

function tlGo(i, spring) {
  const n = TL.events.length;
  if (!n) return;
  TL.i = Math.max(0, Math.min(n - 1, i));
  if (spring) tlSpringTo(TL.i);
  else { TL.x = tlTarget(TL.i); tlLayout(); }
  if (TL.syncSteps) TL.syncSteps();
}

function tlBind() {
  const stage = $("#tlStage"), track = $("#tlTrack");
  if (!stage || !track || stage.dataset.bound === "1") return;
  stage.dataset.bound = "1";

  let startX = 0, startOffset = 0, downT = 0, moved = false, lastX = 0, lastT = 0;

  const onDown = (e) => {
    if (e.button != null && e.button !== 0) return;
    cancelAnimationFrame(TL.settle);
    TL.dragging = false; moved = false;
    startX = lastX = e.clientX;
    startOffset = TL.x;
    downT = performance.now();
    lastT = downT;
    TL.vel = 0;
    stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
  };

  const onMove = (e) => {
    if (!stage.hasPointerCapture || !stage.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) < TL_DRAG_THRESHOLD) return;
    moved = true;
    TL.dragging = true;
    const now = performance.now();
    const dt = now - lastT;
    if (dt > 0) TL.vel = (e.clientX - lastX) / dt * 1000;  // px/s, for the flick
    lastX = e.clientX; lastT = now;

    let x = startOffset - dx;
    const max = tlTarget(Math.max(0, TL.events.length - 1));
    // rubber band: past either end, follow the finger at a fraction and ease
    if (x < 0) x = x * TL_RUBBER;
    else if (x > max) x = max + (x - max) * TL_RUBBER;
    TL.x = x;
    tlLayout();
  };

  const onUp = (e) => {
    if (!stage.hasPointerCapture || !stage.hasPointerCapture(e.pointerId)) return;
    stage.releasePointerCapture && stage.releasePointerCapture(e.pointerId);
    const wasDrag = TL.dragging;
    TL.dragging = false;

    if (!wasDrag) {
      // a press that never moved is a click on whichever card it landed on
      const ev = e.target.closest && e.target.closest(".tlev");
      const i = ev ? Number(ev.dataset.i) : null;
      if (Number.isFinite(i)) tlGo(i, true);
      else if (!Number.isFinite(i)) tlGo(TL.i, true);
      return;
    }

    // a flick coasts for as many events as its velocity earns, capped, then the
    // position is snapped to that event and the spring does the settle
    const per = TL.w * TL_SIDE_SCALE + TL.w * 0.22;
    const earned = Math.max(-TL_FLICK_MAX, Math.min(TL_FLICK_MAX, (-TL.vel * TL_FLICK) / (per || 240)));
    let target = Math.round(TL.i + Math.sign(TL.x - tlTarget(TL.i)) * 0 + earned);
    // settle to the nearest event to wherever the drag actually stopped
    let best = TL.i, bestD = Infinity;
    for (let i = 0; i < TL.events.length; i++) {
      const d = Math.abs(tlTarget(i) - TL.x);
      if (d < bestD) { bestD = d; best = i; }
    }
    target = Math.max(0, Math.min(TL.events.length - 1, best + Math.round(earned)));
    TL.i = target;
    tlSpringTo(target);
  };

  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", onUp);

  // Walking the windows should not require a drag. A mouse user has no swipe,
  // so arrows on the stage, a wheel/trackpad flick, and the two buttons beside
  // the rail all do the same one-step move.
  stage.addEventListener("keydown", (e) => {
    let i = TL.i;
    if (e.key === "ArrowRight") i += 1;
    else if (e.key === "ArrowLeft") i -= 1;
    else if (e.key === "Home") i = 0;
    else if (e.key === "End") i = TL.events.length - 1;
    else return;
    e.preventDefault();
    tlGo(i, true);
  });

  let wheelAcc = 0, wheelT = 0, wheelLock = false;
  stage.addEventListener("wheel", (e) => {
    // only take over when the gesture is sideways or clearly a flick, so a
    // vertical page scroll over the strip still scrolls the page
    const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) && Math.abs(e.deltaY) < 18) return;
    e.preventDefault();
    const now = performance.now();
    if (now - wheelT > 260) wheelAcc = 0;
    wheelT = now;
    if (wheelLock) return;
    wheelAcc += dx;
    if (Math.abs(wheelAcc) < 40) return;
    wheelAcc = 0;
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 230);
    tlGo(TL.i + (dx > 0 ? 1 : -1), true);
  }, { passive: false });

  // Bound on the section rather than on the buttons themselves: the rail row is
  // painted after the first render, so binding the nodes here would miss them.
  const tline = $("#tline");
  if (tline) tline.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest(".tlstep");
    if (!b) return;
    e.preventDefault();
    tlGo(TL.i + (b.id === "tlNext" ? 1 : -1), true);
  });
  const syncSteps = () => {
    const p = $("#tlPrev"), n = $("#tlNext"), last = TL.events.length - 1;
    if (p) p.dataset.end = TL.i <= 0 ? "1" : "0";
    if (n) n.dataset.end = TL.i >= last ? "1" : "0";
  };
  TL.syncSteps = syncSteps;
  syncSteps();

  // a click on a veiled neighbour focuses it; the card itself is the button
  track.addEventListener("click", (e) => {
    if (TL.dragging) return;
    const ev = e.target.closest && e.target.closest(".tlev");
    if (!ev) return;
    const i = Number(ev.dataset.i);
    if (Number.isFinite(i) && i !== TL.i) tlGo(i, true);
  });

  window.addEventListener("resize", () => {
    if (!TL.events.length) return;
    tlPad();
    tlLayout(false);
  });
}

function renderTimeline() {
  tlBuild();
  // the rail is markup, not generated per event: one bar and one counter
  const root = $("#tline");
  if (root && !root.querySelector(".tlrailrow")) {
    const row = document.createElement("div");
    row.className = "tlrailrow";
    row.innerHTML = '<button class="tlstep" id="tlPrev" type="button" aria-label="Previous window"><svg class="ic"><use href="#i-chev-l"/></svg></button>'
      + '<div class="tlrail"><i></i></div><b></b>'
      + '<button class="tlstep" id="tlNext" type="button" aria-label="Next window"><svg class="ic"><use href="#i-chev-r"/></svg></button>';
    const hint = root.querySelector(".tlhint");
    root.insertBefore(row, hint);
  }
  if (TL.events.length) tlLayout(false);
}

function renderPager(pages, total, start, shown) {
  const box = $("#pager");
  if (!box) return;
  // One row at every width, after Longroom's member pager: arrows at the ends,
  // the current page filled, an ellipsis standing in for the stretch skipped.
  // The count of rows on this page is kept as a quiet line above it rather than
  // competing for the same row.
  const arrow = (p, label, icon, off) =>
    `<button class="pstep" data-p="${p}"${off ? " disabled" : ""} aria-label="${label}">`
      + `<svg class="ic"><use href="#${icon}"/></svg><span>${label}</span></button>`;
  const cur = n => `<button data-p="${n}"${n === PAGE ? ' aria-current="page"' : ""}>${n}</button>`;
  // A fixed number of slots at every page and every width. The windowed version
  // grew and shrank as you stepped (159 -> 187 -> 215px), which moved the arrow
  // out from under the thumb that was about to tap it again. Page 1 and the last
  // page always hold a slot; the rest of the row is a window around the current
  // page, and a slot the window skipped is drawn as an ellipsis - a non-button,
  // so the row never reflows mid-tap.
  // A fixed row of SLOTS cells at every page and every width, ellipses included.
  // Windowed pagers grow and shrink as you step - 8 cells here, 9 there - which
  // slides the arrow sideways exactly as the thumb comes down on it. So the row
  // is a plan of SLOTS cells first: the ends and a run around the current page
  // take the number cells, and whatever is left over becomes an ellipsis. The
  // run is widened page by page to swallow the leftovers, so the count never
  // changes. On the pages that need only one ellipsis the row drops to SLOTS-1,
  // on purpose: one ellipsis fewer than two, and never more than one cell of
  // travel between steps.
  const SLOTS = window.innerWidth <= 400 ? 6 : 8;
  const plan = (() => {
    if (pages <= SLOTS) return {nums: Array.from({length: pages}, (_, i) => i + 1), gaps: 0};
    // start with the minimum a window can be: 1, PAGE, pages
    let lo = PAGE, hi = PAGE;
    const widthOf = () => {
      const inside = hi - lo + 1;
      const before = lo > 2 ? 1 : 0;     // ellipsis between 1 and lo
      const after = hi < pages - 1 ? 1 : 0;
      return inside + 2 + before + after; // + the two ends
    };
    // grow around the current page until the row is full
    while (widthOf() < SLOTS && (lo > 2 || hi < pages - 1)) {
      if (hi < pages - 1 && (PAGE - lo <= hi - PAGE || lo <= 2)) hi++;
      else if (lo > 2) lo--;
      else hi++;
    }
    if (widthOf() > SLOTS && (lo > 2 || hi < pages - 1)) {
      // too wide: give back the furthest side
      if (PAGE - lo > hi - PAGE) lo++; else hi--;
    }
    const nums = [1];
    for (let i = lo; i <= hi; i++) nums.push(i);
    nums.push(pages);
    return {nums: [...new Set(nums)].sort((x, y) => x - y), gaps: null};
  })();
  const nums = [];
  plan.nums.forEach((n, i) => {
    if (i && n - plan.nums[i - 1] > 1) nums.push('<span class="gap" aria-hidden="true">…</span>');
    nums.push(cur(n));
  });
  // The first and last pages sit flush against one end, so they plan one cell
  // short. Pad them with an invisible, inert cell rather than letting the row
  // narrow: the digits stay on the same x for every page, and the arrow beside
  // next is always in the same place.
  while (nums.length < (pages <= SLOTS ? pages : SLOTS)) {
    nums.splice(nums.length - 1, 0, '<span class="gap pad" aria-hidden="true"></span>');
  }
  const info = pages > 1 ? `<span class="pinfo">${start + 1}–${start + shown} of ${total}</span>` : "";
  box.innerHTML = info
    + `<span class="pnums">${arrow("prev", "Previous page", "i-chev-l", PAGE === 1)}`
    + `${nums.join("")}${arrow("next", "Next page", "i-chev-r", PAGE === pages)}</span>`;
  bindPager(box, pages);
}

// a rotation or a window resize changes how many rows a page holds. Paging the
// board back to one keeps the reader from landing on a page number that a
// narrower layout no longer has.
// the listener waits for the first paint: a media query can flip while the script
// is still being parsed (mobile emulation, a rotation during load), and rendering
// from inside that callback ran before the card and paging state existed
// The breakpoint is enough for a rotation, but opening the page with no emulation
// and only then switching to a phone view is just a resize across it, sometimes
// without the query reporting a change. A debounced resize catches both, and the
// first render afterwards lays the board out for the width it actually has.
let BOOTED = false;
let RESIZE_T = null;
function refitSoon() {
  if (!BOOTED) return;
  clearTimeout(RESIZE_T);
  RESIZE_T = setTimeout(() => { PAGE = 1; render(); }, 120);
}
if (PHONE_MQ.addEventListener) PHONE_MQ.addEventListener("change", refitSoon);
window.addEventListener("resize", refitSoon);
window.addEventListener("orientationchange", refitSoon);

// Sixteen dots do not fit across a thumb's reach, so a phone shows a five-wide
// window that walks with the page, and an ellipsis stands in for the stretch it
// skipped. The ends are always reachable with a few taps of next.
function pageWindow(pages) {
  const span = 5;
  if (pages <= span) return Array.from({ length: pages }, (_, k) => k + 1);
  let from = Math.max(1, PAGE - 2), to = from + span - 1;
  if (to > pages) { to = pages; from = to - span + 1; }
  return Array.from({ length: to - from + 1 }, (_, k) => from + k);
}

// one handler for every control the pager can draw, so the phone and the desktop
// halves cannot disagree about what "next" means
function bindPager(box, pages) {
  box.querySelectorAll("button[data-p]").forEach(b => {
    if (!b.getAttribute("aria-label") && /^\d+$/.test(b.dataset.p)) b.setAttribute("aria-label", "Page " + b.dataset.p);
    b.onclick = () => {
      const v = b.dataset.p;
      const next = v === "prev" ? PAGE - 1 : v === "next" ? PAGE + 1 : parseInt(v, 10);
      if (!next || next < 1 || next > pages || next === PAGE) return;
      // paging keeps the reader where they are: the board is already on screen,
      // so jumping to it only steals the scroll position
      PAGE = next; render();
    };
  });
}

// ---- creator profile card, opened by pointing at a name. Built from a profile
// resolved against X and proven to be the same person; when nothing could be
// proven the card says so instead of showing someone else's numbers.
function socIcons(prof) {
  if (!prof) return "";
  const out = [];
  // the website field arrives as a string, but an older map shipped it as an
  // object; read either shape rather than throwing inside the card builder
  const raw = prof.website;
  const site = typeof raw === "string" ? raw : (raw && raw.url) || "";
  const w = site.toLowerCase();
  out.push(`<a href="${esc(prof.url)}" target="_blank" rel="noopener noreferrer" title="X profile" aria-label="X profile">`
    + `<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7 8 8.2 12h-6.4l-5-7.3L6 22H2.9l7.5-8.6L2.5 2H9l4.5 6.6L18.9 2zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20z"/></svg></a>`);
  if (/youtube\.com|youtu\.be/.test(w))
    out.push(`<a href="${esc(site)}" target="_blank" rel="noopener noreferrer" title="YouTube" aria-label="YouTube">`
      + `<svg viewBox="0 0 24 24"><path d="M23 12s0-3.4-.4-5c-.3-1-.9-1.8-1.9-2C19 4.6 12 4.6 12 4.6s-7 0-8.7.4c-1 .2-1.6 1-1.9 2C1 8.6 1 12 1 12s0 3.4.4 5c.3 1 .9 1.8 1.9 2 1.7.4 8.7.4 8.7.4s7 0 8.7-.4c1-.2 1.6-1 1.9-2 .4-1.6.4-5 .4-5zM9.8 15.6V8.4l5.8 3.6-5.8 3.6z"/></svg></a>`);
  if (/instagram\.com/.test(w))
    out.push(`<a href="${esc(site)}" target="_blank" rel="noopener noreferrer" title="Instagram" aria-label="Instagram">`

const isSheet = () => window.matchMedia("(max-width:760px)").matches;
function ensureCard() {
  if (cardEl) return cardEl;
  cardEl = el("div", "pcard");
  cardEl.setAttribute("role", "dialog");
  cardEl.setAttribute("aria-modal", "true");
  cardEl.setAttribute("aria-label", "Creator profile");
  cardEl.addEventListener("mouseenter", () => clearTimeout(cardTimer));
  cardEl.addEventListener("mouseleave", hideCardSoon);
  cardEl.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) { hideCard(); return; }
    const b = e.target.closest("[data-pick]");
    if (!b) return;
    SEL = b.dataset.pick; render(); hideCard();
  });
  cardBack = el("div", "cardback");
  cardBack.addEventListener("click", hideCard);
  document.body.appendChild(cardBack);
  document.body.appendChild(cardEl);
  // a drag down on the sheet dismisses it, like any native bottom sheet. The
  // move is only treated as a drag once it passes a small threshold, so a tap
  // on the pick button never gets swallowed.
  let dragY = null, dragFrom = 0;
  cardEl.addEventListener("pointerdown", e => {
    if (!isSheet() || e.target.closest("button,a,input,select,textarea")) return;
    dragY = e.clientY; dragFrom = 0;
  });
  cardEl.addEventListener("pointermove", e => {
    if (dragY === null) return;
    dragFrom = Math.max(0, e.clientY - dragY);
    if (dragFrom < 6) return;
    cardEl.classList.add("dragging");
    cardEl.style.transform = `translateY(${dragFrom}px)`;
  });
  const endDrag = () => {
    if (dragY === null) return;
    const moved = dragFrom;
    dragY = null; dragFrom = 0;
    cardEl.classList.remove("dragging");
    cardEl.style.transform = "";
    if (moved > 90) hideCard();
  };
  cardEl.addEventListener("pointerup", endDrag);
  cardEl.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && cardEl && cardEl.classList.contains("on")) { hideCard(); }
    if (e.key === "Tab" && isSheet() && cardEl && cardEl.classList.contains("on")) {
      const f = cardEl.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  return cardEl;
}
function hideCardSoon() { if (isSheet()) return; clearTimeout(cardTimer); cardTimer = setTimeout(hideCard, 140); }
function hideCard() {
  // The body is unlocked even when no card was ever built: a load that fails
  // before the first open still needs the page it left behind to scroll.
  document.body.classList.remove("sheetopen");
  if (!cardEl) return;
  cardEl.classList.remove("on");
  cardEl.style.transform = "";
  if (cardBack) cardBack.classList.remove("on");
  cardFor = null;
  if (sheetOpener && document.contains(sheetOpener)) { try { sheetOpener.focus({ preventScroll: true }); } catch (_) {} }
  sheetOpener = null;
}

function placeCard(anchor) {
  // Anchor to the avatar, not the name cell: the card should look like it belongs
  // to the face you pointed at, and its top edge should line up with that face.
  const face = anchor.querySelector(".avatar") || anchor;
  const r = face.getBoundingClientRect();
  const pad = 12;
  const w = cardEl.offsetWidth || 284;
  const h = cardEl.offsetHeight || 300;
  let left = r.right + pad;
  if (left + w > window.innerWidth - pad) left = Math.max(pad, r.left - w - pad);
  // The avatar should sit level with the card's own photo, not with its banner:
  // the card's face is 26px below the banner plus a -26px pull, so shifting the
  // card down by that offset lines the two faces up.
  const cardFaceOffset = 72 - 26 + 15; // banner height minus the avatar's negative margin, plus the pad above the name
  let top = r.top - cardFaceOffset;
  const maxTop = window.innerHeight - h - pad;
  // Near the bottom of the screen there is no room to hang the card beside the
  // face, so lift it above the avatar rather than sliding it down out of line.
  if (top > maxTop) {
    const above = r.top - h + (r.height || 22) - cardFaceOffset;
    top = above >= pad ? above : maxTop;
  }
  if (top < pad) top = pad;
  cardEl.style.left = Math.round(left) + "px";
  cardEl.style.top = Math.round(top) + "px";
}

// The card for one creator, built once and reusable: both the avatar's own
// handlers and a tap anywhere on the row open the same thing.
function openCard(anchor, c) {
  clearTimeout(cardTimer);
  ensureCard();
  cardEl.innerHTML = cardHtml(c);
  cardFor = c.name;
  if (isSheet()) {
    // sheet: no anchoring, no hover to keep it alive — it is a modal surface
    sheetOpener = anchor;
    cardEl.style.left = ""; cardEl.style.top = "";
    cardEl.classList.add("on");
    cardBack.classList.add("on");
    document.body.classList.add("sheetopen");
    const f = cardEl.querySelector("[data-close]");
    if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (_) {} }, 60);
    return;
  }
  cardEl.style.left = "-9999px"; cardEl.style.top = "0px";
  cardEl.classList.add("on");
  // measure and place right away, then again on the next frame so the card
  // lands correctly once fonts and the banner have settled. A background tab
  // can starve requestAnimationFrame, so the first pass must not depend on it.
  placeCard(anchor);
  requestAnimationFrame(() => { if (cardFor === c.name) placeCard(anchor); });
}

function bindCard(anchor, c) {
  anchor.setAttribute("role", "button");
  anchor.setAttribute("tabindex", "0");
  const open = () => openCard(anchor, c);
  if (!isSheet()) {
    anchor.addEventListener("mouseenter", () => { clearTimeout(cardTimer); open(); });
    anchor.addEventListener("mouseleave", hideCardSoon);
    // Losing window focus (switching tabs, alt-tab, a screenshot) also fires
    // blur. Only close when focus actually moved to another element on the
    // page, otherwise the card vanishes while the reader is still on it.
    anchor.addEventListener("blur", () => {
      setTimeout(() => {
        if (!document.hasFocus()) return;
        if (anchor.contains(document.activeElement)) return;
        hideCardSoon();
      }, 0);
    });
  }
  // a touch screen has no hover, so tapping the face opens the sheet directly;
  // the row underneath opens the same thing for a tap that misses the face
  anchor.addEventListener("click", e => { e.stopPropagation(); clearTimeout(cardTimer); open(); });
  anchor.addEventListener("focus", () => { if (!isSheet()) { clearTimeout(cardTimer); open(); } });
  anchor.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); open(); }
  });
}

function barStyle(m) {
  const w = Math.min(50, Math.abs(m) / 2);
  return m >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`;
}

// ---------- lineup + receipts
function renderLineup() {
  const spent = PICKS.reduce((a, p) => a + p.estStars, 0);
  $("#cap").textContent = `${spent}/${CAP} ${STAR}`;
  const slot = $("#slot"); slot.innerHTML = "";
  for (let i = 0; i < SIZE; i++) {
    const p = PICKS[i];
    const chip = el("span", "s" + (p ? " spent" : ""));
    if (p) {
      const meta = DATA.creators.find(x => x.name === p.name);
      chip.innerHTML = avatar(meta, "sm") + `<b>${esc(p.name)}</b> ${STAR.repeat(p.estStars)}`;
    } else {
      chip.textContent = `empty ${i + 1}`;
    }
    slot.appendChild(chip);
  }
  // Projection, shown live so a rarity swap is visible before locking. It uses the
  // rank stand-in for Motion Score and the assumed boost table - labelled as such.
  const proj = $("#proj");
  if (proj) {
    if (!PICKS.length) {
      proj.textContent = `${SIZE - PICKS.length} more pick${SIZE - PICKS.length === 1 ? "" : "s"} to see a projection`;
    } else {
      const n = DATA.creators.length;
      const strength = p => (n - Math.min(p.position, n) + 1) / n;
      const sum = PICKS.reduce((a, p) => a + strength(p) * (BOOST[p.rarity] || 1), 0);
      const bs = PICKS.reduce((a, p) => a + (BOOST[p.rarity] || 1), 0);
      proj.innerHTML = `projected <b>${sum.toFixed(2)}</b> · boosts ×${bs.toFixed(2)} · ` +
        `strength is a rank stand-in, boosts are assumed — not the game's Lineup Score`;
    }
  }
  const h = handle();
  const lb = $("#lockBtn");
  lb.disabled = PICKS.length !== SIZE || !h;
  ctaLabel(lb, lockLabel(h));
  lb.onclick = lockLineup;
  renderWho();
}

// The landing CTA is a label plus a disc, so its label is a child span rather than
// the button's text; writing textContent here would delete the arrow.
// Counts on X are read at a glance, so they shorten to K and M — and a million
// keeps three decimals, because the difference between 3.3M and 4.18M is the whole
// point of showing the number. Flooring stops a near-miss reading as a bigger
// number than it is (399,999 must not print as 400K when it is 399K).
function shortNum(n) {
  const v = Number(n);
  if (!isFinite(v) || v < 0) return "—";
  const cut = (x, d) => (Math.floor(x * 10 ** d) / 10 ** d);
  if (v >= 1e9) return cut(v / 1e9, 2).toString().replace(/\.0+$/, "") + "B";
  if (v >= 1e6) return cut(v / 1e6, 3).toString().replace(/\.0+$/, "") + "M";
  if (v >= 1e3) return cut(v / 1e3, 1).toString().replace(/\.0$/, "") + "K";
  return String(Math.round(v));
}

function ctaLabel(btn, text) {

// ---------- public book rendering
// The book card is gone from the page: receipts still file through /api/receipts
// and still settle, but the dashboard no longer shows the ledger. Kept as a
// guarded no-op so loadBook() and the post-lock refresh do not throw.
// ---------- your own record
// The book is public; this is the same data read from one player's side. The
// standings are computed over every receipt in the book, not just the ones on
// screen, so a rank means something even with a book of hundreds.
function renderMine() {
  const box = $("#mineBody"), state = $("#mineState");
  if (!box || !state) return;
  const me = ME && ME.connected ? String(ME.user && ME.user.handle || "").toLowerCase() : "";
  if (!me) {
    state.textContent = "";
    box.innerHTML = `<div class="empty">Connect X to keep your receipts in one place: your positions, what they settled at, and where you stand.</div>`;
    return;
  }
  if (!BOOK) {
    // "unreachable" told the reader nothing. The card names what failed, says the
    // retry is already running, and keeps the manual way out one click away.
    state.textContent = "offline";
    box.innerHTML = `<div class="empty">
        The book did not answer just now${BOOK_ERR ? ` (${esc(BOOK_ERR)})` : ""} — nothing is lost, the page keeps trying every minute.
        <button class="ghosty" id="mineRetry" type="button" style="margin-top:10px">${icon("layers")}Try again</button>
      </div>`;
    const rb = $("#mineRetry");
    if (rb) rb.onclick = () => { rb.disabled = true; rb.textContent = "Trying…"; loadBook(); };
    return;
  }
  const all = BOOK.receipts || [];
  const mine = all.filter(r => String(r.player || "").toLowerCase() === me);
  state.textContent = mine.length ? `${mine.length}` : "";

  if (!mine.length) {
    box.innerHTML = `<div class="empty">No receipts yet. Lock a lineup and it lands here, graded once a later snapshot arrives.</div>`;
    return;
  }

  // standings: net rank over graded receipts, one line per player
  const net = new Map();
  for (const r of all) {
    if (r.status !== "settled" || r.score == null) continue;
    const k = String(r.player || "").toLowerCase();
    net.set(k, (net.get(k) || 0) + r.score);
  }
  const ranked = [...net.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const at = ranked.findIndex(([k]) => k === me);
  const myNet = mine.reduce((n, r) => n + (r.status === "settled" && r.score != null ? r.score : 0), 0);
  const gradedMine = mine.filter(r => r.status === "settled").length;

  const lead = at >= 0
    ? `<div class="stand"><b>${ord(at + 1)}</b><span class="of">of ${ranked.length}</span>
         <span class="sep">·</span><span>net ${signed(myNet)} rank</span>
         <span class="sep">·</span><span>${gradedMine} graded</span></div>`
    : `<div class="stand"><b>${mine.length}</b><span class="of">filed</span>
         <span class="sep">·</span><span>no grade yet — waiting on the next snapshot</span></div>`;

  box.innerHTML = lead + mine.map(r => {
    const done = r.status === "settled" && r.score != null;
    const when = String(r.slotAtLock || "").slice(0, 16).replace("T", " ");
    const picks = (r.picks || []).map(p => {
      const mv = p.move == null ? `<span class="mv flat"></span>` :
        `<span class="mv ${cls(p.move)}">${signed(p.move)}</span>`;
      const now = p.positionNow == null ? "" :
        `<span class="arw">→</span>${esc(String(p.positionNow))}`;
      const rr = p.rarity && p.rarity !== "Common" ? `<i class="rr">${esc(p.rarity)}</i>` : "";
      return `<span class="p" title="${esc(p.name)} — filed at ${esc(String(p.positionAtLock))}${p.positionNow != null ? ", now " + esc(String(p.positionNow)) : ""}">` +
        `<b>${esc(p.name)}${rr}</b>` +
        `<span class="at">#${esc(String(p.positionAtLock))}${now}</span>` +
        `${mv}</span>`;
    }).join("");
    return `<div class="mx">
        <div class="mx-h">
          <span class="slot">${esc(when)}Z</span>
          <span class="st ${done ? "done" : "live"}"><span class="dot"></span>${done ? "settled" : "pending"}</span>
          <span class="vt ${done ? cls(r.score) : ""}">${done ? signed(r.score) : "—"}</span>
        </div>
        <div class="mx-p">${picks}</div>
      </div>`;
  }).join("");
}

// 1 -> 1st, 2 -> 2nd, 11 -> 11th: a rank reads as a place, not an index
function ord(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function renderBook() {
  const box = $("#receipts"), meta = $("#bookMeta");
  if (!box || !meta) return;
  if (!BOOK) {
    meta.textContent = "";
    const hr0 = $("#hitRate"); if (hr0) hr0.textContent = "—";
    box.innerHTML = `<div class="empty">The book could not be read just now (${esc(BOOK_ERR || "no response")}). Retrying on the next beat — nothing has been lost.</div>`;
    return;
  }
  const s = BOOK.summary || {};
  // A receipt locked in the newest window is settled but has not been graded against a
  // later snapshot: it must not count as a miss, so it is pulled out of the denominator.
  const ungraded = (BOOK.receipts || []).filter(r => r.status === "settled" && r.slotAtLock && r.settledAt === r.slotAtLock).length;
  const graded = Math.max(0, (s.settled || 0) - ungraded);
  const hr = $("#hitRate");
  if (hr) hr.textContent = (s.hitRate == null
    ? (s.pending ? `${s.pending} pending` : "—")
    : graded
      ? `${Math.round((s.hitRate * (s.settled || 0) * 100) / graded)}% of ${graded}`
      : "no window yet");
  if (!hr) return;
  meta.textContent = `${s.count} receipt${s.count === 1 ? "" : "s"} · ${graded} graded` +
    (ungraded ? ` · ${ungraded} waiting for a window` : "") +
    ` · ${s.pending || 0} pending · net ${signed(s.netRank || 0)} rank` +
    (BOOK.asOf ? ` · graded to ${String(BOOK.asOf).slice(0, 16).replace("T", " ")}Z` : "");
  const list = BOOK.receipts || [];
  if (!list.length) {
    box.innerHTML = `<div class="empty">No receipts yet. Lock a lineup and it becomes the first line in this book.</div>`;
    return;
  }
  box.innerHTML = list.slice(0, 8).map(r => {
    const done = r.status === "settled";
    const picks = (r.picks || []).map(p => {
      const tag = p.rarity && p.rarity !== "Common" ? `<i class="rr">${esc(p.rarity)}</i>` : "";
      if (p.move == null) return esc(p.name) + tag;
      return `${esc(p.name)}${tag} <span class="${cls(p.move)}">${signed(p.move)}</span>`;
    }).join(" · ");
    return `<div class="rec"><div class="l">
        <div class="who">${r.avatar
          ? `<img class="avatar k" src="${esc(r.avatar)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-ini="${esc(String(r.player || "?").slice(0, 2).toUpperCase())}" data-extra="k" onerror="${AV_FB}">`
          : icon("user", "font-size:11px;opacity:.7")}<b>@${esc(r.player || "?")}</b> · ${(r.picks || []).length} picks${r.name && r.name.toLowerCase() !== String(r.player || "").toLowerCase() ? ` <span style="color:var(--ink);font-size:10px">${esc(r.name)}</span>` : ""}</div>
        <div class="picks">${picks}</div>
      </div>
      <div class="score ${done ? cls(r.score) : "flat"}">${done ? signed(r.score) : "pending"}<small>${done ? (r.settledAt && r.slotAtLock && r.settledAt === r.slotAtLock ? "no window yet" : "net rank") : "not graded"}</small></div>
    </div>`;
  }).join("");
}

// ---------- the filing receipt
// A lineup is the one thing a visitor gives the room, so the answer is a small card
// that reads like the thing itself: what was filed, under which handle, into which
// window, and when it starts earning. alert() could not say any of that.
function showSheet(html) {
  const sh = $("#sheet"), plate = $("#sheetPlate");
  if (!sh || !plate) return;
  plate.innerHTML = html;
  sh.hidden = false;
  // one frame between display and the class, or the transition never runs
  requestAnimationFrame(() => sh.classList.add("on"));
  const close = () => {
    sh.classList.remove("on");
    setTimeout(() => { if (!sh.classList.contains("on")) sh.hidden = true; }, 240);
  };
  sh._close = close;
  plate.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  // a click on the dim area closes it; a click on the plate must not
  sh.addEventListener("click", e => { if (e.target === sh) close(); });
  document.addEventListener("keydown", function esc(e) {
    if (e.key !== "Escape") return;
    document.removeEventListener("keydown", esc);
    close();
  });
  const p = plate.querySelector("button.primary");
  if (p) setTimeout(() => p.focus({ preventScroll: true }), 60);
  else setTimeout(() => close && null, 0);
  return close;
}

function showFiled(h, rec) {
  const settled = rec && rec.status === "settled" && rec.score != null;
  const slot = rec && rec.slotAtLock ? String(rec.slotAtLock).slice(0, 16).replace("T", " ") + "Z" : "this window";
  const picks = (rec && rec.picks || PICKS || []).map(p => {
    const at = p.positionAtLock != null ? p.positionAtLock : p.position;
    return `<span class="chip" title="${esc(p.name)} at ${esc(String(at))}"><i>${esc(String(at))}</i><b>${esc(p.name)}</b></span>`;
  }).join("");
  const n = (rec && rec.picks ? rec.picks.length : PICKS.length) || 0;
  showSheet(`
    <div class="kick"><span class="tick">${icon("check")}</span>Filed</div>
    <h3 id="sheetTitle">In the book,<br>under <b>@${esc(h)}</b></h3>
    <p class="sub">${settled
      ? "It graded against the snapshot already on the desk."
      : "Nothing to score it against yet: the next snapshot with a later <em>asOf</em> grades it, and the grade is permanent."}</p>
    <div class="ticks">
      <div class="tickrow"><span class="k">Slot</span><span class="v">${esc(slot)}</span></div>
      <div class="tickrow"><span class="k">Picks</span><span class="v">${n} of ${n}</span></div>
      <div class="tickrow"><span class="k">${settled ? "Net rank" : "Status"}</span><span class="v">${settled ? signed(rec.score) : "pending"}</span></div>
    </div>
    <div class="picks"><span class="plabel">Filed at rank</span><div class="pgrid">${picks}</div></div>
    <div class="foot">
      <button data-close>Stay here</button>
      <button class="primary" data-close id="sheetSeen">See my receipts</button>
    </div>`);
  const seen = $("#sheetSeen");
  if (seen) seen.addEventListener("click", () => {
    const card = $("#mineCard");
    if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

// ---------- lock + settle
function lockLineup() {
  if (PICKS.length !== SIZE) return;
  const h = handle();
  if (!h) { renderWho(); return; }
  // no player field: the server takes the handle from the signed session cookie
  const body = {
    slotAtLock: (DATA.dataAsOf || ""),
    picks: PICKS.map(p => ({ name: p.name, positionAtLock: p.position, estStars: p.estStars, rarity: p.rarity, thesis: p.thesis, premortem: p.premortem })),
  };
  const btn = $("#lockBtn");
  btn.disabled = true; ctaLabel(btn, "Filing…");
  fetch("/api/receipts", { method: "POST", headers: { "content-type": "application/json" },
      credentials: "same-origin", body: JSON.stringify(body) })
    .then(async r => {
      const out = await r.json().catch(() => ({}));
      if (r.status === 401) { ME = { connected: false, configured: AUTH_CFG }; renderWho(); }
      if (!r.ok) throw new Error(out.error || ("HTTP " + r.status));
      // the lineup is only cleared once the book has it; a lost receipt is worse
      // than a lineup the visitor has to look at twice
      PICKS = []; savePicks(); SEL = null;
      render();
      loadBook();
      showFiled(h, out.receipt);
    })
    .catch(e => {
      btn.disabled = false;
      showSheet(`<div class="kick"><span class="tick" style="background:rgba(180,69,58,.12);color:var(--down,#b4453a)">${icon("x")}</span>Not filed</div>
        <h3 id="sheetTitle">The book refused the receipt</h3>
        <p class="sub">${esc(e.message || "no reason given")}</p>
        <div class="foot"><button class="primary" data-close>Back to the desk</button></div>`);
      render();
    });
}

// ---------- go
load();
loadSession();

// A desk keeps this page open for hours, and the board publishes every four. So
// the page pulls again on a minute beat, the same beat the landing room uses, and
// skips the work while the tab is hidden. History rides along: refreshHistory()
// reports whether anything new arrived, and only then is the timeline redrawn in
// place - the reader keeps whatever card they were on unless the rail itself
// grew a new one, in which case it slides to it.
let SIG_FP = null, HIST_LAST = 0;
const POLL_MS = 60000;
async function poll() {
  if (document.hidden || !DATA) return;
  try {
    const r = await fetch("/api/signals", { headers: { accept: "application/json" }, cache: "no-store" });
    if (r.ok) {
      const next = await r.json();
      const sig = JSON.stringify(next);
      if (sig !== SIG_FP) {
        SIG_FP = sig;
        DATA = next;
        render();
      }
    }
  } catch (e) {}
  // a book that failed to load is retried on the same minute beat, so a cold start
  // or a dropped packet repairs itself without a reload
  if (!BOOK) loadBook();
  const grew = await refreshHistory();
  if (grew) {
    renderTimeline();
    const last = TL.events.length - 1;
    if (last > HIST_LAST) tlGo(last, true);
    HIST_LAST = last;
  }
}
setInterval(poll, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
// the CTA under the switch is a shortcut into the board, not a second flow
document.addEventListener("click", e => {
  const cta = e.target && e.target.closest && e.target.closest("#ctaDraft");
  if (!cta) return;
  const board = document.querySelector("#rows");
  if (board && board.scrollIntoView) board.scrollIntoView({ behavior: "smooth", block: "start" });
  const first = document.querySelector("#rows tr.row");
  // focus without scrolling: focusing a row after scrollIntoView made the
  // browser jump a second time and land on the last row instead of the board
  if (first) first.focus && first.focus({ preventScroll: true });
});
// the identity card is rebuilt by renderWho(), so its buttons are bound there; the
// session is fetched once at load and again when the OAuth popup reports back
</script>
<script>
/* theme switch — one knob group per page, one stored value, both pages agree */
(function () {
  var root = document.documentElement;
  var mem = document.getElementById('themesw');
  var btns = mem ? mem.querySelectorAll('[data-theme-set]') : [];
  var meta = document.querySelector('meta[name="theme-color"]');
  var paper = { light: '#f4f3f0', dark: '#0f0f0e' };

  function paint(t) {
    root.setAttribute('data-theme', t);
    if (meta) meta.setAttribute('content', paper[t] || paper.light);
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', String(btns[i].getAttribute('data-theme-set') === t));
    }
    if (mem) mem.setAttribute('data-on', t);
  }
  function set(t) {
    if (t !== 'dark' && t !== 'light') return;
    root.classList.add('theming');
    window.setTimeout(function () { root.classList.remove('theming'); }, 400);
    paint(t);
    try { localStorage.setItem('mdr-theme', t); } catch (e) {}
  }

  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () { set(this.getAttribute('data-theme-set')); });
  }
  paint(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

  // with no stored choice, the page keeps following the system
  try {
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function (e) {
      var stored = null;
      try { stored = localStorage.getItem('mdr-theme'); } catch (err) {}
      if (!stored) paint(e.matches ? 'dark' : 'light');
    });
  } catch (e) {}
})();
</script>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="plate" id="sheetPlate"></div>
</div>
</body>
</html>
