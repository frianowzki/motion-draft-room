name: collect

# Runs OUTSIDE the agent VM on purpose: this machine is suspended every 30 minutes,
# so anything time-triggered has to live here. Six runs a day align with Motion's
# 4-hour leaderboard slots (00/04/08/12/16/20 UTC).
#
# Keep this file on the DEFAULT branch (`data`). GitHub only fires `schedule` from
# the default branch, so while `main` was default the `data` copy never ran: 00Z and
# 08Z had no run at all on 2026-11-16. The job checks out `data`, which is where
# snapshots are committed.
#
# Keep this file on `main`. GitHub only fires `schedule` from the default branch,
# and `main` is the default here, so a copy that exists only on `data` never runs
# (the 2026-11-16 gaps: 00Z and 08Z had no run at all). The job itself checks out
# `data`, which is still where snapshots are committed.

on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshot
        run: python3 collector/snapshot.py

      - name: Rebuild signals
        run: python3 engine/score.py

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name  "motion-draft-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots data/latest.json data/signals.json
          if git diff --cached --quiet; then
            echo "no change in this slot; nothing to commit"
            exit 0
          fi
          SLOT=$(date -u +%Y-%m-%dT%H:%MZ)
          git commit -m "data: snapshot ${SLOT}"
          git push
      - name: Verify the slot was recorded
        # Runs even when the commit step found nothing new: a skipped slot and a
        # duplicate slot look identical from the outside, and only this step can
        # tell "already have it" from "the cron never fired".
        if: always()
        run: python3 collector/verify.py
